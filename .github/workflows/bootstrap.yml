name: Load BI historical transaction rates
on:
  push:
    branches: [master]
    paths: ['scripts/update.mjs', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bi-data
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official data parser
        run: node scripts/update-test.mjs
      - name: Fetch Bank Indonesia history
        run: node scripts/update.mjs
      - name: Preserve verified source observations
        if: always()
        run: |
          if test -f docs/data/bi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/bi.json
            if ! git diff --cached --quiet; then
              git commit -m "data: import official BI transaction history"
              git pull --rebase origin master
              git push origin HEAD:master
            fi
          fi
      - name: Keep source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bi-source-data
          path: docs/data/bi.json
          retention-days: 7
